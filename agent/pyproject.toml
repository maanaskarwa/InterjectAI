[project]
name = "decision-window"
version = "0.1.0"
description = "Deadline-aware voice research participant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "brightdata-sdk>=2.5.0",
    "httpx>=0.28.1",
    "livekit-agents>=1.6.7",
    "livekit-plugins-inworld>=1.6.7",
    "openai>=2.52.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
decision-window = "decision_window.main:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
